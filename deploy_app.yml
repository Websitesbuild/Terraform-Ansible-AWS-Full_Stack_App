---
- name: Deploy Book App on EC2
  hosts: all
  become: yes

  tasks:

    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install required packages
      apt:
        name:
          - docker.io
          - docker-compose-v2
          - git
        state: present

    - name: Enable Docker service
      service:
        name: docker
        enabled: yes
        state: started

    - name: Give permission to docker socket
      file:
        path: /var/run/docker.sock
        mode: '0666'

    - name: Clone Book App repository
      git:
        repo: "https://github.com/Websitesbuild/Book_App.git"
        dest: /opt/Book_App
        version: main
        force: yes

    - name: Run Docker Compose
      shell: docker compose up -d
      args:
        chdir: /opt/Book_App