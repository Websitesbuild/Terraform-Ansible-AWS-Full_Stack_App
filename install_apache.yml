- hosts: webservers
  become: yes

  tasks:
    - name: Install Apache (Ubuntu/Debian)
      apt:
        name: apache2
        state: present
        update_cache: yes
      when: ansible_os_family == "Debian"

    - name: Install Apache (Amazon Linux / RHEL)
      yum:
        name: httpd
        state: present
      when: ansible_os_family == "RedHat"

    - name: Start Apache (Debian)
      service:
        name: apache2
        state: started
        enabled: yes
      when: ansible_os_family == "Debian"

    - name: Start Apache (RHEL)
      service:
        name: httpd
        state: started
        enabled: yes
      when: ansible_os_family == "RedHat"